<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiDen Signup</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main>
        <form action="">
            <h1>Join a cozy club of creators sharing their digital stories and shops.</h1>
            <p>Tell us who you are, what you create, and why your digital shop is special. Let's build a warm, supportive marketplace together.</p>

            <fieldset>
                <input type="text" name="name">
                <input type="text" name="username">
            </fieldset>

            <fieldset>
                <input type="email" name="email">
                <input type="tel" name="tel">
            </fieldset>

            <fieldset>
                <input type="password" name="pwd">
                <input type="password" name="pwd_confirm">
            </fieldset>

            <fieldset>
                <select name="role"></select>
                <select name="goal"></select>
            </fieldset>

            <textarea name="fun-fact"></textarea>

            <fieldset>
                <input type="checkbox" name="consent">
                <input type="submit">
            </fieldset>
        </form>
    </main>
</body>
</html>
